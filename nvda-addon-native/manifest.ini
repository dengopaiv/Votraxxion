description = The Votrax SC-01 phoneme speech synthesizer, emulated at the chip level. Both mask revisions — the 1980 SC-01 and the later SC-01-A — with a built-in letter-to-sound front end, sentence prosody, and constant-pitch rate control. Self-contained: one native library, no Python dependencies and no data files.
